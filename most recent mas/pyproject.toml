[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mascov"
version = "0.1.0"
description = "Multi-agent drone coverage: simulation environment and algorithms"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "shapely>=2.0", "matplotlib>=3.7", "scipy>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]
stl = ["scipy>=1.9"]          # scipy bundles the HiGHS MILP solver used by the STL planners

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
